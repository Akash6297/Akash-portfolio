<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Akash Mandal</title>
    <link href="/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.5);
        }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .animate-pulse-slow { animation: pulse-slow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen flex items-center justify-center relative overflow-hidden p-4">

    <!-- Aurora glow background, matches the main site -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute w-[45rem] h-[45rem] bg-teal-500/20 rounded-full blur-[140px] animate-pulse-slow -top-40 -left-60"></div>
        <div class="absolute w-[40rem] h-[40rem] bg-cyan-500/15 rounded-full blur-[140px] animate-pulse-slow bottom-0 -right-40" style="animation-delay: 2s;"></div>
        <div class="absolute w-[30rem] h-[30rem] bg-emerald-500/15 rounded-full blur-[120px] animate-pulse-slow bottom-1/4 left-1/3" style="animation-delay: 4s;"></div>
    </div>

    <div class="w-full max-w-md">
        <!-- Brand -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-14 h-14 relative mb-3">
                <div class="absolute inset-0 bg-teal-500 rounded-xl blur-lg opacity-40"></div>
                <img src="/logo.png" alt="Akash Logo" class="relative w-full h-full object-cover rounded-xl border border-white/10 shadow-2xl">
            </div>
            <span class="text-2xl font-black text-white tracking-tighter leading-none">AKASH<span class="text-teal-400">.</span></span>
            <span class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase mt-1">Admin Panel</span>
        </div>

        <div class="glass-card rounded-3xl p-8 md:p-10">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 text-center mb-1 tracking-tight">Welcome Back</h1>
            <p class="text-slate-400 text-sm text-center mb-8">Sign in to manage your portfolio</p>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username" class="block text-slate-300 text-sm font-medium mb-2">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500/70 focus:border-teal-400 shadow-inner transition-all" placeholder="Enter your username">
                </div>
                <div>
                    <label for="password" class="block text-slate-300 text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl py-3 px-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500/70 focus:border-teal-400 shadow-inner transition-all" placeholder="Enter your password">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-bold py-3.5 rounded-xl hover:from-teal-400 hover:to-emerald-400 shadow-[0_8px_24px_-8px_rgba(20,184,166,0.6)] hover:shadow-[0_12px_32px_-8px_rgba(20,184,166,0.8)] hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                    Log In
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
                <p id="login-status" class="text-center text-sm text-rose-400 min-h-[1.25rem]"></p>
            </form>
        </div>

        <a href="/" class="mt-6 flex items-center justify-center gap-2 text-slate-500 hover:text-teal-400 text-sm transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Main Site
        </a>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginStatus = document.getElementById('login-status');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = loginForm.username.value;
            const password = loginForm.password.value;
            loginStatus.textContent = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = '/admin/dashboard.html'; // Redirect on success
                } else {
                    loginStatus.textContent = data.message || 'Login failed.';
                }
            } catch (err) {
                loginStatus.textContent = 'An error occurred.';
            }
        });
    </script>
</body>
</html>
